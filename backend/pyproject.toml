[project]
name = "sylithe"
version = "0.1.0"
description = "Sylithe AI — autonomous DevOps agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "sqlalchemy>=2.0.36",
]

[project.scripts]
sylithe = "sylithe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sylithe*"]

[tool.setuptools.package-data]
sylithe = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
